spring.main.banner-mode=off
spring.main.web-application-type=none

logging.level.root=ERROR
logging.level.com.websec=INFO

logging.pattern.console=%d{HH:mm:ss} [%-5level] %msg%n

scanner.http.timeout=5000

scanner.port.timeout=2000

scanner.subdomain.max=50

scanner.endpoint.delay=200

scanner.http.user-agent=WebSec-Scanner/1.0 (Educational Tool)

scanner.report.output-dir=reports